    "প্ৰেমৰ সম্পৰ্কত আৱেগ বৃদ্ধি পাব পাৰে। খং নিয়ন্ত্ৰণত ৰাখিলে দিনটো অধিক সুন্দৰ হ'ব।",
    "অতিৰিক্ত আশাবাদী হৈ হঠাতে ডাঙৰ সিদ্ধান্ত নল'ব। প্ৰেমৰ ক্ষেত্ৰত সুখৰ মুহূৰ্ত লাভ কৰিব।",
    "প্ৰেমৰ ক্ষেত্ৰত সংগীৰ অনুভূতিক গুৰুত্ব দিয়ক। অত্যধিক কামৰ মাজতো স্বাস্থ্যৰ যত্ন ল'বলৈ নাপাহৰিব।",
    "কোনো পুৰণি বন্ধুৰ সাথে পুনৰ যোগাযোগ হ'ব পাৰে। কিন্তু তাড়াহুড়াকৈ কোনো ডাঙৰ সিদ্ধান্ত নল'ব।",
    "পৰিয়ালৰ পৰা মানসিক সমৰ্থন লাভ কৰিব। নিজৰ স্বাস্থ্য আৰু মানসিক শান্তিৰ প্ৰতি যত্ন লওক।"
  ];

  const seed = now.getFullYear() * 1000 + (now.getMonth() + 1) * 50 + now.getDate();
  const container = document.getElementById("rashi-container");

  rashis.forEach((r, idx) => {
    const p1 = line1[(seed + idx * 3) % line1.length];
    const p2 = line2[(seed + idx * 5) % line2.length];
    const p3 = line3[(seed + idx * 7) % line3.length];

    const card = document.createElement("div");
    card.className = "rashi-card";
    card.innerHTML = `
      <div class="rashi-head" style="background: ${r.color};">
        <div class="rashi-icon">${r.icon}</div>
        <div>${r.name}</div>
      </div>
      <div class="rashi-body">
        ${p1} ${p2} ${p3}
      </div>
    `;
    container.appendChild(card);
  });

  function downloadRashifalImage() {
    const sheet = document.getElementById("rashifal-sheet");
    html2canvas(sheet, { scale: 2, useCORS: true }).then(canvas => {
      const link = document.createElement("a");
      link.download = `Ajir_Rashifal_${now.getDate()}_${now.getMonth()+1}_${now.getFullYear()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>
